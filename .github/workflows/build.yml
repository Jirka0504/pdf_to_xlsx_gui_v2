name: Build PDF to XLSX EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole pdf_to_xlsx_gui_v2.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-xlsx-gui
          path: dist/pdf_to_xlsx_gui_v2.exe
